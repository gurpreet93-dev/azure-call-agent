<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Voice Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#5f6b7a; --line:#e3e7ec; --accent:#5b3fd6; --agent:#eef0ff; --you:#e9f7ef; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b2028; --text:#e7ebf0; --muted:#9aa5b1; --line:#2c333d; --accent:#9d8bff; --agent:#252a3d; --you:#1f3127; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  label { font-size: 14px; color: var(--muted); }
  select, input[type=text] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=text] { flex: 1; min-width: 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #mic { width: 72px; height: 72px; border-radius: 50%; font-size: 28px; background: var(--accent); color:#fff; border:none; }
  #mic.listening { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(91,63,214,.5)} 70%{box-shadow:0 0 0 18px rgba(91,63,214,0)} 100%{box-shadow:0 0 0 0 rgba(91,63,214,0)} }
  #log { margin: 16px 0; display:flex; flex-direction:column; gap:10px; min-height: 160px; }
  .msg { padding: 10px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
  .you { background: var(--you); align-self: flex-end; }
  .agent { background: var(--agent); align-self: flex-start; }
  .sys { color: var(--muted); font-size: 13px; align-self: center; text-align:center; }
  .sys.err { color: var(--err); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #status { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Foundry Voice Agent</h1>
  <p class="sub">Tap the microphone once and talk, in any of the languages below. The agent (Microsoft Foundry) listens and replies with Azure Speech; you can talk over it to interrupt.</p>

  <div class="card">
    <div class="row">
      <label for="lang">Language</label>
      <select id="lang">
        <option value="en-IN" selected>English (India)</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="bn-IN">বাংলা (Bengali)</option>
        <option value="gu-IN">ગુજરાતી (Gujarati)</option>
        <option value="mr-IN">मराठी (Marathi)</option>
        <option value="pa-IN">ਪੰਜਾਬੀ (Punjabi)</option>
        <option value="ta-IN">தமிழ் (Tamil)</option>
        <option value="te-IN">తెలుగు (Telugu)</option>
        <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
        <option value="ml-IN">മലയാളം (Malayalam)</option>
        <option value="or-IN">ଓଡ଼ିଆ (Odia)</option>
        <option value="en-US">English (US)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="ar-SA">العربية (Arabic)</option>
        <option value="zh-CN">中文 (Mandarin)</option>
      </select>
      <label title="Listens while the agent talks and ignores its own voice by comparing words"><input type="checkbox" id="bargein" checked> Interrupt by speaking</label>
      <button id="reset">New conversation</button>
    </div>

    <div id="log"></div>

    <div class="row" style="justify-content:center; flex-direction:column; gap:6px">
      <button id="mic" title="Tap and speak">🎤</button>
      <div id="status">Tap the microphone and speak</div>
    </div>

    <form id="typeform" class="row" style="margin-top:16px">
      <input type="text" id="typed" placeholder="…or type a message" autocomplete="off">
      <button class="primary" type="submit">Send</button>
    </form>
  </div>
</main>

<script src="/static/vendor/speech-sdk-1.51.0.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const SDK = window.SpeechSDK;                                   // Azure AI Speech (recognition)
const ChromeSR = window.SpeechRecognition || window.webkitSpeechRecognition;   // fallback only
let conversationId = null, busy = false, speaking = false, pending = null;
let finishSpeaking = null;          // ends the reply that is playing; true = interrupted
let replyWords = new Set();         // words of the reply being spoken, to recognise our own echo
const player = new Audio();

function log(cls, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  $('log').appendChild(d); d.scrollIntoView({behavior: 'smooth', block: 'end'});
  return d;
}
function status(t) { $('status').textContent = t; }
async function api(path, body, method) {
  const r = await fetch(path, method === 'GET' ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  if (!r.ok) { let msg = r.statusText; try { msg = (await r.json()).detail || msg; } catch {} throw new Error(msg); }
  return r;
}
async function ensureConversation() {
  if (conversationId) return conversationId;
  conversationId = (await (await api('/api/conversation')).json()).conversation_id;
  return conversationId;
}
const words = (t) => t.toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
function isEcho(heard) {            // mostly the reply's own words = the agent heard through the speakers
  const w = words(heard);
  return !w.length || w.filter(x => replyWords.has(x)).length / w.length >= 0.6;
}
function setLanguage(lang, why) {
  const sel = $('lang');
  if (!lang || lang === sel.value || ![...sel.options].some(o => o.value === lang)) return;
  sel.value = lang;
  log('sys', 'Language: ' + sel.selectedOptions[0].text + ' (' + why + ').');
}

// ---------- reply voice: Azure Speech, browser voice as fallback ----------
function speak(text) {
  const lang = $('lang').value;
  speaking = true; replyWords = new Set(words(text));
  return new Promise(async (resolve) => {
    let done = false, via = 'Azure Speech';
    finishSpeaking = (interrupted, why) => {
      if (done) return; done = true; speaking = false; finishSpeaking = null;
      player.pause(); window.speechSynthesis && speechSynthesis.cancel();
      resolve({via: why || via, interrupted: !!interrupted});
    };
    const fin = finishSpeaking;
    try {
      const r = await api('/api/speak', {text, lang});
      via = 'Azure Speech · ' + (r.headers.get('X-Voice') || '');
      setLanguage(r.headers.get('X-Lang'), 'the agent is replying in it');
      const url = URL.createObjectURL(await r.blob());
      if (done) return URL.revokeObjectURL(url);
      player.src = url;
      player.onended = () => { URL.revokeObjectURL(url); fin(false); };
      player.onerror = () => fin(false, 'audio playback failed');
      await player.play();
    } catch (e) {
      if (done) return;
      via = 'browser voice (Azure Speech failed: ' + e.message + ')';
      if (!window.speechSynthesis) return fin(false, 'not spoken (' + e.message + ')');
      const u = new SpeechSynthesisUtterance(text); u.lang = lang;
      u.onend = u.onerror = () => fin(false);
      setTimeout(() => fin(false), 3000 + text.length * 90);   // some browsers never fire onend
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  });
}

// ---------- one turn ----------
async function send(text) {
  text = text.trim();
  if (!text) return;
  if (busy) { pending = text; return; }          // said while the agent was thinking: send it next
  busy = true;
  log('you', text);
  try {
    status('Thinking…');
    const r = await api('/api/chat', {conversation_id: await ensureConversation(), text});
    const reply = (await r.json()).reply || '(no reply)';
    const bubble = log('agent', reply.replace(/【[^】]*】/g, ''));
    status(session ? 'Speaking… (just talk, or tap the mic, to interrupt)' : 'Speaking… (tap the mic to interrupt)');
    const res = await speak(reply);
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = 'voice: ' + res.via + (res.interrupted ? ' · interrupted' : '');
    bubble.appendChild(m);
  } catch (e) {
    log('sys err', e.message);
  } finally {
    busy = false;
    status(session ? 'Listening… (tap the mic to stop)' : 'Tap the microphone and speak');
    if (pending) { const t = pending; pending = null; send(t); }
    else if (!session && fallbackOn) chromeListen();
  }
}
function interrupt() { if (speaking && finishSpeaking) finishSpeaking(true); }

// ---------- listening: one continuous Azure Speech session for the whole call ----------
// The mic stream has echo cancellation on, so the agent's own voice is mostly removed before recognition;
// anything that still sounds like the reply is ignored by isEcho(). The caller's words interrupt the reply.
let session = null;   // {recognizer, stream, refresh}
function candidateLanguages() {
  return [...new Set([$('lang').value, 'en-IN', 'hi-IN'])];
}
async function startSession() {
  const {token, region} = await (await api('/api/speech-token', null, 'GET')).json();
  const stream = await navigator.mediaDevices.getUserMedia(
    {audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  const cfg = SDK.SpeechConfig.fromAuthorizationToken(token, region);
  cfg.setProperty(SDK.PropertyId.SpeechServiceConnection_LanguageIdMode, 'Continuous');
  const recognizer = SDK.SpeechRecognizer.FromConfig(cfg,
    SDK.AutoDetectSourceLanguageConfig.fromLanguages(candidateLanguages()), SDK.AudioConfig.fromStreamInput(stream));
  recognizer.recognizing = (_, e) => {
    const t = e.result.text || '';
    if (speaking && $('bargein').checked && words(t).length >= 2 && !isEcho(t)) interrupt();
  };
  recognizer.recognized = (_, e) => {
    if (e.result.reason !== SDK.ResultReason.RecognizedSpeech) return;
    const t = (e.result.text || '').trim();
    if (!t || (speaking && isEcho(t))) return;
    try { setLanguage(SDK.AutoDetectSourceLanguageResult.fromResult(e.result).language, 'detected from your voice'); } catch {}
    if (speaking) interrupt();
    send(t);
  };
  recognizer.canceled = (_, e) => {
    log('sys err', 'Speech recognition stopped: ' + (e.errorDetails || e.reason));
    stopSession();
  };
  await new Promise((ok, fail) => recognizer.startContinuousRecognitionAsync(ok, fail));
  const refresh = setInterval(async () => {          // tokens last 10 minutes
    try { recognizer.authorizationToken = (await (await api('/api/speech-token', null, 'GET')).json()).token; } catch {}
  }, 8 * 60 * 1000);
  session = {recognizer, stream, refresh};
  $('mic').classList.add('listening');
  status(busy ? 'Thinking…' : 'Listening… (tap the mic to stop)');
}
function stopSession() {
  const s = session; session = null;
  $('mic').classList.remove('listening');
  if (!s) return;
  clearInterval(s.refresh);
  s.recognizer.stopContinuousRecognitionAsync(() => s.recognizer.close(), () => s.recognizer.close());
  s.stream.getTracks().forEach(t => t.stop());
  if (!busy) status('Stopped. Tap the microphone to talk');
}

// ---------- fallback: Chrome's built-in recognition (no interrupting by voice) ----------
let fallbackOn = false, chromeRec = null;
function chromeListen() {
  if (!ChromeSR || busy || chromeRec) return;
  const r = new ChromeSR(); chromeRec = r;
  r.lang = $('lang').value; r.interimResults = false; r.continuous = false;
  r.onresult = (ev) => { chromeRec = null; send(ev.results[0][0].transcript); };
  r.onerror = () => {}; r.onend = () => { if (chromeRec === r) { chromeRec = null; if (fallbackOn && !busy) setTimeout(chromeListen, 300); } };
  $('mic').classList.add('listening'); status('Listening (browser recognition)…');
  try { r.start(); } catch { chromeRec = null; }
}

// ---------- controls ----------
$('mic').onclick = async () => {
  if (speaking) return interrupt();                                  // tap while the agent talks: stop it
  if (session) return stopSession();
  if (fallbackOn) { fallbackOn = false; try { chromeRec && chromeRec.abort(); } catch {} chromeRec = null;
                    $('mic').classList.remove('listening'); return status('Stopped. Tap the microphone to talk'); }
  status('Starting the microphone…');
  try {
    if (!SDK) throw new Error('Azure Speech SDK did not load');
    await startSession();
  } catch (e) {
    log('sys err', 'Azure speech recognition unavailable (' + e.message + '). Using the browser\'s recognition.');
    if (!ChromeSR) return log('sys err', 'This browser has no speech recognition either. Type below.');
    fallbackOn = true; chromeListen();
  }
};
$('typeform').onsubmit = (ev) => { ev.preventDefault(); const t = $('typed').value; $('typed').value = ''; send(t); };
$('reset').onclick = () => { conversationId = null; pending = null; interrupt(); $('log').innerHTML = '';
  log('sys', 'New conversation. The agent has forgotten the previous one.'); };
$('lang').onchange = () => {
  log('sys', 'Language: ' + $('lang').selectedOptions[0].text + '.');
  if (session) { stopSession(); startSession().catch(e => log('sys err', e.message)); }   // re-tune the language detector
};
if (!SDK) log('sys', 'Azure Speech SDK did not load; the browser\'s own recognition will be used (Chrome or Edge).');
</script>
</body>
</html>
