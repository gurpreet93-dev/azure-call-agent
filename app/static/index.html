<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Voice Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#5f6b7a; --line:#e3e7ec; --accent:#5b3fd6; --agent:#eef0ff; --you:#e9f7ef; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b2028; --text:#e7ebf0; --muted:#9aa5b1; --line:#2c333d; --accent:#9d8bff; --agent:#252a3d; --you:#1f3127; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  label { font-size: 14px; color: var(--muted); }
  select, input[type=text] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=text] { flex: 1; min-width: 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #mic { width: 72px; height: 72px; border-radius: 50%; font-size: 28px; background: var(--accent); color:#fff; border:none; }
  #mic.listening { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(91,63,214,.5)} 70%{box-shadow:0 0 0 18px rgba(91,63,214,0)} 100%{box-shadow:0 0 0 0 rgba(91,63,214,0)} }
  #log { margin: 16px 0; display:flex; flex-direction:column; gap:10px; min-height: 160px; }
  .msg { padding: 10px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
  .you { background: var(--you); align-self: flex-end; }
  .agent { background: var(--agent); align-self: flex-start; }
  .sys { color: var(--muted); font-size: 13px; align-self: center; text-align:center; }
  .sys.err { color: var(--err); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #status { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Foundry Voice Agent</h1>
  <p class="sub">Tap the microphone once and talk, in any of the languages below. The agent (Microsoft Foundry) listens and replies with Azure Speech; you can talk over it to interrupt.</p>

  <div class="card">
    <div class="row">
      <label for="lang">Language</label>
      <select id="lang">
        <option value="en-IN" selected>English (India)</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="bn-IN">বাংলা (Bengali)</option>
        <option value="gu-IN">ગુજરાતી (Gujarati)</option>
        <option value="mr-IN">मराठी (Marathi)</option>
        <option value="pa-IN">ਪੰਜਾਬੀ (Punjabi)</option>
        <option value="ta-IN">தமிழ் (Tamil)</option>
        <option value="te-IN">తెలుగు (Telugu)</option>
        <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
        <option value="ml-IN">മലയാളം (Malayalam)</option>
        <option value="or-IN">ଓଡ଼ିଆ (Odia)</option>
        <option value="en-US">English (US)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="ar-SA">العربية (Arabic)</option>
        <option value="zh-CN">中文 (Mandarin)</option>
      </select>
      <label for="agent">Knowledge</label>
      <select id="agent" title="Which Foundry agent answers: same prompt, different search tool">
        <option value="clearview-glass-agent-filesearch" selected>File search</option>
        <option value="">Azure AI Search</option>
      </select>
      <label title="Listens while the agent talks and ignores its own voice by comparing words"><input type="checkbox" id="bargein" checked> Interrupt by speaking</label>
      <button id="reset">New conversation</button>
    </div>

    <div id="log"></div>

    <div class="row" style="justify-content:center; flex-direction:column; gap:6px">
      <button id="mic" title="Tap and speak">🎤</button>
      <div id="status">Tap the microphone and speak</div>
    </div>

    <form id="typeform" class="row" style="margin-top:16px">
      <input type="text" id="typed" placeholder="…or type a message" autocomplete="off">
      <button class="primary" type="submit">Send</button>
    </form>
  </div>
</main>

<script src="/static/vendor/speech-sdk-1.51.0.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const SDK = window.SpeechSDK;                                   // Azure AI Speech (recognition)
const ChromeSR = window.SpeechRecognition || window.webkitSpeechRecognition;   // fallback only
let conversationId = null, busy = false, speaking = false, pending = null;
let superseded = false;             // the caller said something new while the agent was working on the last turn
// Foundry's stored conversation (default): each call is one conversation, shown as one thread with its totals in
// Foundry's Conversation view. It re-sends earlier search results every turn, so tokens grow with each question.
// ?history=text keeps the history in the page as plain text instead (flat tokens, no Conversation view).
const STORED_HISTORY = new URLSearchParams(location.search).get('history') !== 'text';
const MAX_HISTORY = 80;             // messages (40 exchanges): enough for a full lead capture with read-backs
let history = [];
let finishSpeaking = null;          // ends the reply that is playing; true = interrupted
let replyWords = new Set();         // words of the reply being spoken, to recognise our own echo
const player = new Audio();

function log(cls, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  $('log').appendChild(d); d.scrollIntoView({behavior: 'smooth', block: 'end'});
  return d;
}
function status(t) { $('status').textContent = t; }
const API_TIMEOUT_MS = 60000;      // the server gives up on the agent after 45 s; never leave the caller hanging
async function api(path, body, method) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), API_TIMEOUT_MS);
  let r;
  try {
    r = await fetch(path, method === 'GET' ? {signal: ctl.signal} :
      {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {}), signal: ctl.signal});
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'No answer after ' + API_TIMEOUT_MS / 1000 + ' seconds. Please try again.' : e.message);
  } finally { clearTimeout(timer); }
  if (!r.ok) { let msg = r.statusText; try { msg = (await r.json()).detail || msg; } catch {} throw new Error(msg); }
  return r;
}
async function ensureConversation() {
  if (conversationId) return conversationId;
  conversationId = (await (await api('/api/conversation')).json()).conversation_id;
  return conversationId;
}
const words = (t) => t.toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
function isEcho(heard) {            // mostly the reply's own words = the agent heard through the speakers
  const w = words(heard);
  return !w.length || w.filter(x => replyWords.has(x)).length / w.length >= 0.6;
}
function setLanguage(lang, why) {
  const sel = $('lang');
  if (!lang || lang === sel.value || ![...sel.options].some(o => o.value === lang)) return;
  sel.value = lang;
  log('sys', 'Language: ' + sel.selectedOptions[0].text + ' (' + why + ').');
  restartListening();
}
function restartListening() {       // recognition listens in one language, so a new language needs a new session
  if (session) { stopSession(); startSession().catch(e => log('sys err', e.message)); }
}

// ---------- timing: where the wait between "reply ready" and "voice starts" goes ----------
const now = () => performance.now();
function serverTiming(r) {                     // Server-Timing header -> {llm: ms, tts_first_audio: ms, ...}
  const out = {};
  (r.headers.get('Server-Timing') || '').split(',').forEach(p => {
    const m = p.match(/([\w-]+);dur=([\d.]+)/); if (m) out[m[1]] = +m[2];
  });
  return out;
}
function timingText(t) {
  const s = (ms) => (ms / 1000).toFixed(2) + ' s';
  const after = (k) => t[k] != null && t.llmDone != null ? '+' + s(t[k] - t.llmDone) : '–';
  const agent = t.server && t.server.llm != null ? ' (agent ' + s(t.server.llm) + ')' : '';
  const azure = t.server && t.server.tts_first_audio != null ? ' (Azure ' + s(t.server.tts_first_audio) + ')' : '';
  const stopped = stoppedAt(t);
  const heard = t.recognized != null
    ? 'you stopped → recognised ' + (stopped != null ? s(t.recognized - stopped) : '–') +
      (t.speechEnd != null && t.lastWords != null ? ' (last partial → recognised ' + s(t.recognized - t.lastWords) + ')' : '') +
      ' → sent ' + s(t.sent - t.recognized) + ' · '
    : '';
  return '⏱ ' + heard + 'reply ' + s(t.llmDone - t.sent) + agent + ' · after reply: voice request ' + after('ttsReq') +
    ', first audio ' + after('firstChunk') + azure + ', playing ' + after('playing') +
    (t.mode ? ' · ' + t.mode : '') +
    (t.tokens && t.tokens.input != null ? ' · ' + t.tokens.input + ' tokens in' +
      (t.tokens.cached ? ' (' + t.tokens.cached + ' cached)' : '') + ', ' + (STORED_HISTORY ? 'stored' : 'text') + ' history' : '') +
    (stopped != null && t.playing != null ? ' · TOTAL you stopped → voice ' + s(t.playing - stopped) : '');
}
// When the caller actually stopped talking: the end of their speech in Azure's audio timeline when available,
// otherwise the last partial result (which arrives after their last word, so it understates the wait).
function stoppedAt(t) { return t.speechEnd != null ? t.speechEnd : t.lastWords; }

// Azure reports each result's position in the audio stream (offset + duration, in 100-nanosecond ticks from the
// first audio sample of the session). Audio is streamed in real time, so session start + that position = the
// moment the caller's speech ended, on the page's clock. Accurate to about ±0.1 s (when the first sample is read).
function speechEndTime(audioStart, offsetTicks, durationTicks, heardAt) {
  if (audioStart == null || !(offsetTicks >= 0) || !(durationTicks >= 0)) return null;
  const end = audioStart + (offsetTicks + durationTicks) / 10000;
  const lag = heardAt - end;
  return lag >= 0 && lag < 5000 ? end : null;           // implausible (clock drifted, e.g. tab in background): skip
}

// ---------- reply voice: Azure Speech (streamed), browser voice as fallback ----------
// Streaming: the MP3 is fed to the player through Media Source Extensions as chunks arrive, so playback starts
// on the first chunk. Browsers without MSE for MP3 (older iPhones) download the whole file first, as before.
const canStream = !!(window.MediaSource && MediaSource.isTypeSupported && MediaSource.isTypeSupported('audio/mpeg'));

async function readAll(r, t) {                 // whole response, noting when the first chunk arrived
  const reader = r.body.getReader(), parts = [];
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    if (t.firstChunk == null) t.firstChunk = now();
    parts.push(value);
  }
  return new Blob(parts, {type: 'audio/mpeg'});
}

// Plays the response as it downloads. Returns false (body untouched) if MSE can't be set up, so the caller can
// fall back to the buffered player with the same response.
async function playStreaming(r, t, isDone, fin) {
  const ms = new MediaSource(), url = URL.createObjectURL(ms);
  let sb;
  try {
    player.src = url;
    await new Promise((ok, fail) => { ms.addEventListener('sourceopen', ok, {once: true});
                                      setTimeout(() => fail(new Error('sourceopen timeout')), 3000); });
    sb = ms.addSourceBuffer('audio/mpeg');
  } catch (e) { URL.revokeObjectURL(url); return false; }
  const append = (chunk) => new Promise((ok, fail) => {
    sb.addEventListener('updateend', ok, {once: true}); sb.addEventListener('error', fail, {once: true});
    sb.appendBuffer(chunk);
  });
  player.onended = () => { URL.revokeObjectURL(url); fin(false); };
  player.onerror = () => fin(false, 'audio playback failed');
  const reader = r.body.getReader();
  let started = false;
  for (;;) {
    const {value, done} = await reader.read();
    if (isDone()) { reader.cancel().catch(() => {}); URL.revokeObjectURL(url); return true; }
    if (done) break;
    if (t.firstChunk == null) t.firstChunk = now();
    await append(value);
    if (!started) { started = true; await player.play(); }
  }
  if (ms.readyState === 'open') ms.endOfStream();
  if (!started) fin(false, 'no audio received');
  return true;
}

function speak(text, t = {}) {
  const lang = $('lang').value;
  speaking = true; replyWords = new Set(words(text));
  return new Promise(async (resolve) => {
    let done = false, via = 'Azure Speech';
    finishSpeaking = (interrupted, why) => {
      if (done) return; done = true; speaking = false; finishSpeaking = null;
      player.pause(); player.onplaying = null; window.speechSynthesis && speechSynthesis.cancel();
      resolve({via: why || via, interrupted: !!interrupted});
    };
    const fin = finishSpeaking;
    player.onplaying = () => { if (t.playing == null) t.playing = now(); };
    player.onerror = null;
    try {
      t.ttsReq = now();
      let r = await api('/api/speak', {text, lang});
      t.ttsHeaders = now();
      t.server = Object.assign(t.server || {}, serverTiming(r));
      via = 'Azure Speech · ' + (r.headers.get('X-Voice') || '');
      setLanguage(r.headers.get('X-Lang'), 'the agent is replying in it');
      if (canStream && r.body) {
        try {
          if (await playStreaming(r, t, () => done, fin)) { t.mode = 'streamed'; return; }
        } catch (e) {
          if (done || t.playing != null) return fin(false, via + ' (stream cut short)');
          t.firstChunk = null;
          r = await api('/api/speak', {text, lang});      // body partly used: fetch again, buffered
        }
      }
      t.mode = 'buffered';
      const url = URL.createObjectURL(r.body ? await readAll(r, t) : await r.blob());
      if (done) return URL.revokeObjectURL(url);
      player.src = url;
      player.onended = () => { URL.revokeObjectURL(url); fin(false); };
      player.onerror = () => fin(false, 'audio playback failed');
      await player.play();
    } catch (e) {
      if (done) return;
      via = 'browser voice (Azure Speech failed: ' + e.message + ')';
      if (!window.speechSynthesis) return fin(false, 'not spoken (' + e.message + ')');
      const u = new SpeechSynthesisUtterance(text); u.lang = lang;
      u.onstart = () => { if (t.playing == null) t.playing = now(); };
      u.onend = u.onerror = () => fin(false);
      setTimeout(() => fin(false), 3000 + text.length * 90);   // some browsers never fire onend
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  });
}

// ---------- one turn ----------
async function send(text, marks) {
  text = text.trim();
  if (!text) return;
  if (busy) {                                    // said while the agent was busy: send it next, and don't speak
    pending = pending ? pending + ' ' + text : text;   // the answer to what the caller has moved on from
    superseded = true; interrupt();
    return;
  }
  busy = true; superseded = false;
  log('you', text);
  try {
    status('Thinking…');
    const body = Object.assign(STORED_HISTORY ? {conversation_id: await ensureConversation(), text} : {history, text},
                               $('agent').value ? {agent: $('agent').value} : {});
    const t = Object.assign({}, marks, {sent: now()});
    const r = await api('/api/chat', body);
    const data = await r.json();
    const reply = data.reply || '(no reply)';
    t.llmDone = now(); t.server = serverTiming(r); t.tokens = data.tokens;
    const spoken = reply.replace(/【[^】]*】/g, '');
    if (!STORED_HISTORY && data.reply) {           // markers point at search results the next turn won't have
      history.push({role: 'user', content: text}, {role: 'assistant', content: spoken.trim() || reply});
      history = history.slice(-MAX_HISTORY);
    }
    const bubble = log('agent', spoken);
    if (superseded) {                              // the caller moved on while this was being prepared
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = 'not spoken: you asked something new'; bubble.appendChild(m);
      return;
    }
    status(session ? 'Speaking… (just talk, or tap the mic, to interrupt)' : 'Speaking… (tap the mic to interrupt)');
    const res = await speak(reply, t);
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = 'voice: ' + res.via + (res.interrupted ? ' · interrupted' : '');
    bubble.appendChild(m);
    const tm = document.createElement('div'); tm.className = 'meta timing'; tm.textContent = timingText(t);
    bubble.appendChild(tm);
    console.table(Object.fromEntries(Object.entries(t).filter(([k, v]) => typeof v === 'number')
      .map(([k, v]) => [k, {ms_after_send: Math.round(v - t.sent), ms_after_reply: Math.round(v - t.llmDone)}])));
    if (stoppedAt(t) != null && t.playing != null)
      console.log('caller stopped talking → agent voice playing: ' + ((t.playing - stoppedAt(t)) / 1000).toFixed(2) +
                  ' s (' + (t.speechEnd != null ? "from Azure's audio timeline" : 'from the last partial result') + ')');
  } catch (e) {
    log('sys err', e.message);
  } finally {
    busy = false;
    status(session ? 'Listening… (tap the mic to stop)' : 'Tap the microphone and speak');
    if (pending) { const t = pending; pending = null; send(t); }
    else if (!session && fallbackOn) chromeListen();
  }
}
function interrupt() { if (speaking && finishSpeaking) finishSpeaking(true); }

// Sentences said within a second of each other ("बताओ बताओ। अरे, गर्मी…") become one turn, not two agent calls.
// Timing of the caller's side: lastWords = last partial result (≈ when they stopped talking, a little after),
// recognized = Azure decided the sentence was over. The send then waits MERGE_MS for a follow-on sentence.
// Azure has already waited for ~0.5 s of silence before "recognized", so a short extra wait is enough.
const MERGE_MS = 1000;
const MERGE_MS_DIGITS = 1800;     // numbers are read out in groups ("946599 ... 2500"), with longer pauses
let heardBuffer = [], heardTimer = null, lastPartialAt = null;
function queueUtterance(t, speechEnd, lastWords) {
  heardBuffer.push(t);
  const marks = {lastWords: lastWords == null ? null : lastWords, recognized: now(),
                 speechEnd: speechEnd == null ? null : speechEnd};
  pendingMarks = marks;
  sendSoon();
}
let pendingMarks = null;
function sendSoon() {
  clearTimeout(heardTimer);
  if (!heardBuffer.length) return;
  const wait = /\d[\s.,]*$/.test(heardBuffer.at(-1)) ? MERGE_MS_DIGITS : MERGE_MS;
  heardTimer = setTimeout(() => { const all = heardBuffer.join(' '); heardBuffer = []; send(all, pendingMarks); }, wait);
}
// The caller started talking again during the wait: hold the words until that sentence is recognised too.
function holdForMore() { if (heardBuffer.length) clearTimeout(heardTimer); }

// ---------- listening: one continuous Azure Speech session for the whole call ----------
// The mic stream has echo cancellation on, so the agent's own voice is mostly removed before recognition;
// anything that still sounds like the reply is ignored by isEcho(). The caller's words interrupt the reply.
let session = null;   // {recognizer, stream, refresh}
const PHRASES = ['U-value', 'solar factor', 'light transmission', 'internal reflection', 'external reflection',
  'single glazing', 'double glazing', 'double glazed unit', 'Saint-Gobain', 'ClearView', 'Planitherm', 'Cool-lite',
  'Antelio Plus', 'Envision', 'Evolite', 'Evo Plus', 'Nano Silver', 'Nano Blue', 'Xtreme', 'Graphite',
  'Icy Menthol', 'Pristine White', 'Lumina', 'Blue Frost', 'Sparkling Ice', 'Planilaque', 'Mira'];
async function startSession() {
  const {token, region} = await (await api('/api/speech-token', null, 'GET')).json();
  const stream = await navigator.mediaDevices.getUserMedia(
    {audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  const cfg = SDK.SpeechConfig.fromAuthorizationToken(token, region);
  // Only the picked language. Detecting English vs Hindi by ear failed on Indian-accented English: "What's the
  // solar..." came back as "वुड्स द सोलर" and switched the call to Hindi. The language changes when the caller
  // picks another one, or when the agent replies in another language (e.g. to Hinglish typed in English letters).
  cfg.speechRecognitionLanguage = $('lang').value;
  const recognizer = new SDK.SpeechRecognizer(cfg, SDK.AudioConfig.fromStreamInput(stream));
  try {   // words recognition should favour: product terms otherwise come back as "EU value", "cool light"
    SDK.PhraseListGrammar.fromRecognizer(recognizer).addPhrases(PHRASES);
  } catch {}
  recognizer.recognizing = (_, e) => {
    const t = e.result.text || '';
    if (t && !(speaking && isEcho(t))) { lastPartialAt = now(); holdForMore(); }
    if (speaking && $('bargein').checked && words(t).length >= 2 && !isEcho(t)) interrupt();
  };
  let audioStart = null;                               // page time of the session's first audio sample
  recognizer.recognized = (_, e) => {
    const heardAt = now();
    if (e.result.reason !== SDK.ResultReason.RecognizedSpeech) { sendSoon(); return; }   // noise: send what's held
    const t = (e.result.text || '').trim();
    if (!t || (speaking && isEcho(t))) return;
    if (speaking) interrupt();
    // Only a partial result from this sentence counts (an old one, e.g. from before the tab was in the
    // background, would make the wait look minutes long).
    const partial = lastPartialAt != null && heardAt - lastPartialAt < 10000 ? lastPartialAt : null;
    lastPartialAt = null;
    queueUtterance(t, speechEndTime(audioStart, e.result.offset, e.result.duration, heardAt), partial);
  };
  recognizer.canceled = (_, e) => {
    log('sys err', 'Speech recognition stopped: ' + (e.errorDetails || e.reason));
    stopSession();
  };
  audioStart = now();
  await new Promise((ok, fail) => recognizer.startContinuousRecognitionAsync(ok, fail));
  const refresh = setInterval(async () => {          // tokens last 10 minutes
    try { recognizer.authorizationToken = (await (await api('/api/speech-token', null, 'GET')).json()).token; } catch {}
  }, 8 * 60 * 1000);
  session = {recognizer, stream, refresh};
  $('mic').classList.add('listening');
  status(busy ? 'Thinking…' : 'Listening… (tap the mic to stop)');
}
function stopSession() {
  const s = session; session = null;
  $('mic').classList.remove('listening');
  if (!s) return;
  clearInterval(s.refresh);
  s.recognizer.stopContinuousRecognitionAsync(() => s.recognizer.close(), () => s.recognizer.close());
  s.stream.getTracks().forEach(t => t.stop());
  if (!busy) status('Stopped. Tap the microphone to talk');
}

// ---------- fallback: Chrome's built-in recognition (no interrupting by voice) ----------
let fallbackOn = false, chromeRec = null;
function chromeListen() {
  if (!ChromeSR || busy || chromeRec) return;
  const r = new ChromeSR(); chromeRec = r;
  r.lang = $('lang').value; r.interimResults = false; r.continuous = false;
  r.onresult = (ev) => { chromeRec = null; send(ev.results[0][0].transcript); };
  r.onerror = () => {}; r.onend = () => { if (chromeRec === r) { chromeRec = null; if (fallbackOn && !busy) setTimeout(chromeListen, 300); } };
  $('mic').classList.add('listening'); status('Listening (browser recognition)…');
  try { r.start(); } catch { chromeRec = null; }
}

// ---------- controls ----------
$('mic').onclick = async () => {
  if (speaking) return interrupt();                                  // tap while the agent talks: stop it
  if (session) return stopSession();
  if (fallbackOn) { fallbackOn = false; try { chromeRec && chromeRec.abort(); } catch {} chromeRec = null;
                    $('mic').classList.remove('listening'); return status('Stopped. Tap the microphone to talk'); }
  status('Starting the microphone…');
  try {
    if (!SDK) throw new Error('Azure Speech SDK did not load');
    await startSession();
  } catch (e) {
    log('sys err', 'Azure speech recognition unavailable (' + e.message + '). Using the browser\'s recognition.');
    if (!ChromeSR) return log('sys err', 'This browser has no speech recognition either. Type below.');
    fallbackOn = true; chromeListen();
  }
};
$('typeform').onsubmit = (ev) => { ev.preventDefault(); const t = $('typed').value; $('typed').value = ''; send(t); };
$('reset').onclick = () => { conversationId = null; history = []; pending = null; interrupt(); $('log').innerHTML = '';
  log('sys', 'New conversation. The agent has forgotten the previous one.'); };
$('agent').onchange = () => {       // a new agent starts a new conversation, so each Foundry thread has one agent
  conversationId = null; history = []; pending = null; interrupt();
  log('sys', 'Knowledge: ' + $('agent').selectedOptions[0].text + '. New conversation started.');
};
$('lang').onchange = () => {
  log('sys', 'Language: ' + $('lang').selectedOptions[0].text + '.');
  restartListening();
};
if (!SDK) log('sys', 'Azure Speech SDK did not load; the browser\'s own recognition will be used (Chrome or Edge).');
</script>
</body>
</html>
