{% extends "base.html" %}{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:40px auto">
  <h1>Create your account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <label>Business name</label><input name="business_name" required>
    <label>Your name</label><input name="owner_name" required>
    <label>Trade</label><input name="trade" value="roofing contractor">
    <label>Email</label><input name="email" type="email" required>
    <label>Password (8+ characters)</label><input name="password" type="password" required minlength="8">
    <p><button>Create account</button></p>
  </form>
</div>
{% endblock %}
